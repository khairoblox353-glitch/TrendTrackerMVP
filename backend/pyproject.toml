[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are handled by the formatter, not the linter
    "B008",   # FastAPI requires `Depends(...)`/`Query(...)` as argument defaults
    "UP037",  # SQLAlchemy relationship targets are kept as quoted forward references
    "UP042",  # `class Status(str, Enum)` keeps JSON and SQL values plainly readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
